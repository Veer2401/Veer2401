name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

# Add these two lines to grant commit access
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Veer2401
          template: classic
          base: header
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_ignored: html, css
