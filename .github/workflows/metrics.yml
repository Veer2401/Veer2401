name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

# Add these two lines to grant commit access
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Veer2401
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          config_theme: neon
          config_animations: yes
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_colors: "0:orange, 1:cyan, 2:magenta, 3:yellow"
          plugin_topics: yes
          plugin_topics_mode: icons
