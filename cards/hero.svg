<svg xmlns="http://www.w3.org/2000/svg"
        width="1500" height="390"
        viewBox="0 0 1500 390" role="img"
        aria-label="Veer Harischandrakar — Developer Profile">
    <title>Veer Harischandrakar — Developer Profile</title>
    <defs>
      <style>
        text {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .muted { fill: #64748B; }
        .heading { fill: #172033; font-weight: 700; }
        @media (prefers-reduced-motion: reduce) {
          animate, animateTransform { display: none; }
        }
      </style>
      <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>
    </defs>
    <rect width="1500" height="390" rx="24" fill="#F8FAFC"/><circle cx="1320" cy="70" r="180" fill="#DBEAFE" opacity=".65"/><circle cx="1400" cy="330" r="150" fill="#BFDBFE" opacity=".45"/>
    <text x="90" y="105" font-size="20" fill="#1D4ED8"
          letter-spacing="4" font-weight="700">HELLO, I'M VEER</text>
    <text x="90" y="190" class="heading" font-size="68">
      Veer Harischandrakar
    </text>
    <text x="92" y="245" font-size="25" fill="#64748B">
      Computer Science &amp; Engineering · Developer · Builder
    </text>
    <text x="92" y="305" font-size="19" fill="#1D4ED8">
      Generative AI  /  Agentic AI  /  Cloud Computing  /  Full-Stack
    </text>
    <rect x="90" y="335" width="110" height="5" rx="2.5" fill="#2563EB"/>
    <circle cx="1290" cy="195" r="85" fill="none"
            stroke="#2563EB" stroke-width="2" opacity=".25"/>
    <circle cx="1290" cy="195" r="65" fill="none"
            stroke="#2563EB" stroke-width="2" opacity=".45"/>
    <circle cx="1290" cy="195" r="45" fill="url(#blueGlow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="1290" y="205" text-anchor="middle"
          font-size="30" fill="white" font-weight="700">V</text>
    </svg>