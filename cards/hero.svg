<svg xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        width="1500" height="390"
        viewBox="0 0 1500 390" role="img"
        aria-label="Veer Harischandrakar — Developer Profile">
    <title>Veer Harischandrakar — Developer Profile</title>
    <defs>
      <style>
        text {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
