<svg xmlns="http://www.w3.org/2000/svg"
        width="1500" height="260"
        viewBox="0 0 1500 260" role="img"
        aria-label="GitHub Activity Summary">
    <title>GitHub Activity Summary</title>
    <defs>
      <style>
        text {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .muted { fill: #64748B; }
        .heading { fill: #172033; font-weight: 700; }
        @media (prefers-reduced-motion: reduce) {
          animate, animateTransform { display: none; }
        }
      </style>
      <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>
    </defs>
    <rect width="1500" height="260" rx="24" fill="#F8FAFC"/><text x="65" y="60" font-size="16" fill="#64748B" letter-spacing="3">GITHUB ACTIVITY</text>
        <rect x="65" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="93" y="130" font-size="14" fill="#64748B"
              letter-spacing="1.5">CARD STATUS</text>
        <text x="93" y="185" font-size="35"
              font-weight="700" fill="#1D4ED8">READY</text>
        
        <rect x="535" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="563" y="130" font-size="14" fill="#64748B"
              letter-spacing="1.5">DATA SOURCE</text>
        <text x="563" y="185" font-size="35"
              font-weight="700" fill="#1D4ED8">LOCAL</text>
        
        <rect x="1005" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="1033" y="130" font-size="14" fill="#64748B"
              letter-spacing="1.5">TOKEN REQUIRED</text>
        <text x="1033" y="185" font-size="35"
              font-weight="700" fill="#1D4ED8">NO</text>
        </svg>