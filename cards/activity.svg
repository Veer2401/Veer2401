<svg xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        width="1500" height="260"
        viewBox="0 0 1500 260" role="img"
        aria-label="GitHub Activity Summary">
    <title>GitHub Activity Summary</title>
    <defs>
      <style>
        text {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .muted { fill: #718075; }
        .heading { fill: #17251B; font-weight: 700; }
        .green { fill: #16A34A; }
        .fade { opacity: .65; }
        @media (prefers-reduced-motion: reduce) {
          animate, animateTransform { display: none; }
        }
      </style>
      <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#22C55E"/>
        <stop offset="100%" stop-color="#087A35"/>
      </linearGradient>
    </defs>
    <rect width="1500" height="260" rx="24" fill="#F5F7F2"/><text x="65" y="60" font-size="16" fill="#718075" letter-spacing="3">GITHUB ACTIVITY</text>
        <rect x="65" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E9E1"/>
        <text x="93" y="130" font-size="14" fill="#718075"
              letter-spacing="1.5">TOTAL CONTRIBUTIONS</text>
        <text x="93" y="185" font-size="43"
              font-weight="700" fill="#087A35">0</text>
        
        <rect x="535" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E9E1"/>
        <text x="563" y="130" font-size="14" fill="#718075"
              letter-spacing="1.5">ACTIVE DAYS</text>
        <text x="563" y="185" font-size="43"
              font-weight="700" fill="#087A35">0</text>
        
        <rect x="1005" y="90" width="420" height="125" rx="18"
              fill="#FFFFFF" stroke="#E2E9E1"/>
        <text x="1033" y="130" font-size="14" fill="#718075"
              letter-spacing="1.5">DAILY AVERAGE</text>
        <text x="1033" y="185" font-size="43"
              font-weight="700" fill="#087A35">0.0</text>
        </svg>