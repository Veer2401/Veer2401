<svg xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        width="500" height="250"
        viewBox="0 0 500 250" role="img"
        aria-label="EXPLORE">
    <title>EXPLORE</title>
    <defs>
      <style>
        text {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .muted { fill: #718075; }
        .heading { fill: #17251B; font-weight: 700; }
        .green { fill: #16A34A; }
        .fade { opacity: .65; }
        @media (prefers-reduced-motion: reduce) {
          animate, animateTransform { display: none; }
        }
      </style>
      <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#22C55E"/>
        <stop offset="100%" stop-color="#087A35"/>
      </linearGradient>
    </defs>
    <rect width="500" height="250" rx="22" fill="#F5F7F2"/>
    <rect x="1" y="1" width="498" height="248" rx="22"
          fill="none" stroke="#E2E9E1"/>
    <text x="32" y="48" font-size="14" fill="#087A35"
          font-weight="700" letter-spacing="2">02</text>
    <text x="32" y="105" class="heading" font-size="38">EXPLORE</text>
    <text x="32" y="145" font-size="18" fill="#718075">Intelligence through AI</text>
    <text x="32" y="195" font-size="14" fill="#087A35">
      Generative AI · Agentic systems
    </text>
    <circle cx="435" cy="45" r="9" fill="#16A34A">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    </svg>